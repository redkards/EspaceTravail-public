<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1720">
<title>Cockpit NEXUS</title>
<style>
  /* Thème : jetons de couleur, clair par défaut, sombre si le système le demande */
  :root {
    --fond: #f4f5f7; --carte: #ffffff; --texte: #18202a; --doux: #5b6675; --bord: #dde1e6;
    --accent: #2459d6; --ok: #1d7a46; --ko: #b42318; --att: #a15c00; --puce: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #0f1720; --carte: #17212c; --texte: #e6ebf1; --doux: #9aa6b4; --bord: #2a3644;
            --accent: #6d97ff; --ok: #4cc584; --ko: #ff6b5e; --att: #f0a941; --puce: #1f2b38; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--carte); border-bottom: 1px solid var(--bord);
           padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  .etat { font-size: 13px; color: var(--doux); }
  nav { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px; background: var(--fond); }
  nav button { flex: 0 0 auto; }
  main { max-width: 980px; margin: 0 auto; padding: 8px 16px 40px; }
  section { display: none; } section.active { display: block; }
  h2 { font-size: 16px; margin: 14px 0 8px; }
  .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .ligne { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .meta { color: var(--doux); font-size: 13px; }
  .puce { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--puce); font-size: 12px; }
  .N3, .eleve, .echouee, .refusee, .suspendue, .expiree { color: var(--ko); }
  .N2, .moyen, .en_attente_n3, .en_attente, .revision { color: var(--att); }
  .terminee, .validee, .faible, .actif { color: var(--ok); }
  button { font: inherit; border: 1px solid var(--bord); background: var(--carte); color: var(--texte);
           border-radius: 8px; padding: 8px 12px; min-height: 40px; cursor: pointer; }
  button.prim { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ok { border-color: var(--ok); color: var(--ok); }
  button.ko { border-color: var(--ko); color: var(--ko); }
  button.urgence { background: var(--ko); border-color: var(--ko); color: #fff; font-weight: 600; }
  nav button.sel { background: var(--accent); color: #fff; border-color: var(--accent); }
  input, textarea, select { font: inherit; width: 100%; padding: 9px; border-radius: 8px;
           border: 1px solid var(--bord); background: var(--fond); color: var(--texte); }
  textarea { min-height: 110px; resize: vertical; }
  label { display: block; margin: 8px 0 4px; font-size: 13px; color: var(--doux); }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--fond); padding: 8px; border-radius: 8px;
        font-size: 13px; max-height: 320px; overflow: auto; margin: 6px 0 0; }
  .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .agent { font-size: 13px; }
  .confirm { display: none; margin-top: 8px; } .confirm.vis { display: block; }
  .vide { color: var(--doux); font-style: italic; }
  #toast { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 10px 14px; border-radius: 8px;
           background: var(--texte); color: var(--fond); display: none; z-index: 9; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
<header>
  <h1>Cockpit NEXUS</h1>
  <span class="etat" id="etat">Chargement…</span>
  <button class="urgence" id="btnUrgence" type="button">Arrêt d'urgence</button>
  <div class="confirm carte" id="confirmUrgence" style="flex-basis:100%">
    <div id="texteUrgence">Confirmer l'arrêt de toute la grille ? Les missions en cours seront suspendues.</div>
    <div class="ligne" style="margin-top:8px">
      <button class="ko" id="btnUrgenceOui" type="button">Confirmer</button>
      <button id="btnUrgenceNon" type="button">Annuler</button>
    </div>
  </div>
</header>
<nav id="onglets">
  <button data-o="decisions" class="sel" type="button">Décisions N3 <span id="nbDec"></span></button>
  <button data-o="missions" type="button">Missions</button>
  <button data-o="nouvelle" type="button">Nouvelle mission</button>
  <button data-o="agents" type="button">Agents</button>
  <button data-o="journal" type="button">Journal</button>
</nav>
<main>
  <section id="decisions" class="active"><h2>Décisions en attente</h2><div id="listeDec"></div></section>
  <section id="missions"><h2>Missions</h2><div id="listeMis"></div></section>
  <section id="nouvelle">
    <h2>Nouvelle mission</h2>
    <form class="carte" id="formMission">
      <label for="titre">Titre</label><input id="titre" required maxlength="200">
      <label for="consigne">Consigne</label><textarea id="consigne" required></textarea>
      <label for="service">Service (facultatif)</label>
      <select id="service"><option value="">Choix automatique</option></select>
      <label for="montant">Montant engagé en € (facultatif)</label><input id="montant" type="number" min="0" step="0.01">
      <label for="action">Action envisagée (facultatif)</label>
      <select id="action"><option value="">Aucune</option><option>envoyer_client</option><option>publier</option>
        <option>signer</option><option>mise_en_production</option><option>depense</option><option>supprimer</option>
        <option>donnees_sensibles</option></select>
      <div class="ligne" style="margin-top:12px"><button class="prim" type="submit">Lancer la mission</button></div>
    </form>
  </section>
  <section id="agents"><h2>Organigramme</h2><div id="listeAg"></div></section>
  <section id="journal">
    <h2>Journal LEDGER</h2>
    <div class="ligne"><button id="btnVerif" type="button">Vérifier la chaîne</button><span id="verif" class="meta"></span></div>
    <div id="listeLed" style="margin-top:8px"></div>
  </section>
</main>
<div id="toast"></div>
<script>
"use strict";
const API = "/cockpit/api";
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LIB = { recue:"reçue", en_cours:"en cours", en_attente_n3:"en attente N3", validee:"validée", refusee:"refusée",
  revision:"révision", terminee:"terminée", echouee:"échouée", suspendue:"suspendue", en_attente:"en attente",
  expiree:"expirée", faible:"faible", moyen:"moyen", eleve:"élevé", actif:"actif", suspendu:"suspendu" };
const lib = (s) => LIB[s] || s || "—";
const date = (d) => d ? new Date(d + (d.endsWith("Z") ? "" : "Z")).toLocaleString("fr-FR") : "";

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 3500); }

async function api(chemin, options = {}) {
  const r = await fetch(API + chemin, { headers: { "Content-Type": "application/json" }, ...options });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail ? (typeof d.detail === "string" ? d.detail : JSON.stringify(d.detail)) : "Erreur " + r.status);
  return d;
}

// Onglets
document.querySelectorAll("#onglets button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll("#onglets button").forEach((x) => x.classList.toggle("sel", x === b));
  document.querySelectorAll("main section").forEach((s) => s.classList.toggle("active", s.id === b.dataset.o));
  try { localStorage.setItem("onglet", b.dataset.o); } catch (e) {}
  rafraichir();
}));

async function chargerDecisions() {
  const l = await api("/decisions?statut=en_attente");
  $("#nbDec").textContent = l.length ? "(" + l.length + ")" : "";
  $("#listeDec").innerHTML = l.length ? l.map((d) => `
    <div class="carte">
      <div class="ligne"><strong>#${d.id} · ${esc(d.mission_titre)}</strong>
        <span class="puce ${d.risque}">risque ${lib(d.risque)}</span>
        <span class="puce">${Number(d.cout_estime_eur).toFixed(2)} €</span></div>
      <pre>${esc(d.resume)}</pre>
      <div class="meta" style="margin-top:6px"><b>Recommandation :</b> ${esc(d.recommandation)}</div>
      <div class="meta"><b>Avis CHECKER :</b> ${esc(d.avis_checker)}</div>
      <div class="meta"><b>Sources :</b> ${esc(d.sources)} · créée le ${date(d.cree_le)}</div>
      <label for="c${d.id}">Commentaire (facultatif)</label><input id="c${d.id}">
      <div class="ligne" style="margin-top:8px">
        <button class="ok" data-d="${d.id}" data-c="valider" type="button">Valider</button>
        <button class="ko" data-d="${d.id}" data-c="refuser" type="button">Refuser</button>
        <button data-d="${d.id}" data-c="reviser" type="button">Demander une révision</button>
        <button data-m="${d.mission_id}" type="button">Voir le livrable</button>
      </div><div id="det${d.mission_id}"></div>
    </div>`).join("") : '<p class="vide">Aucune décision en attente.</p>';
}

$("#listeDec").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.m) return voirMission(b.dataset.m, "#det" + b.dataset.m);
  const c = $("#c" + b.dataset.d).value;
  try { await api(`/decisions/${b.dataset.d}/${b.dataset.c}`, { method: "POST", body: JSON.stringify({ commentaire: c || null }) });
    toast("Décision enregistrée."); rafraichir(); } catch (err) { toast(err.message); }
});

async function voirMission(id, cible) {
  const m = await api("/missions/" + id);
  $(cible).innerHTML = `<pre>${esc(m.livrable_texte || "(pas encore de livrable)")}</pre>
    <div class="meta">${m.etapes.length} étape(s) · ${m.tokens} tokens · ${esc(m.message || "")}</div>`;
}

async function chargerMissions() {
  const l = await api("/missions?limit=50");
  $("#listeMis").innerHTML = l.length ? l.map((m) => `
    <div class="carte">
      <div class="ligne"><strong>#${m.id} · ${esc(m.titre)}</strong>
        <span class="puce ${m.statut}">${lib(m.statut)}</span>
        ${m.niveau ? `<span class="puce ${m.niveau}">${m.niveau}</span>` : ""}</div>
      <div class="meta">${esc(m.service || "service à déterminer")} · ${date(m.cree_le)} · ${m.tokens} tokens</div>
      ${m.message ? `<div class="meta">${esc(m.message)}</div>` : ""}
      <div class="ligne" style="margin-top:6px"><button data-m="${m.id}" type="button">Détail</button></div>
      <div id="mis${m.id}"></div>
    </div>`).join("") : '<p class="vide">Aucune mission pour le moment.</p>';
}
$("#listeMis").addEventListener("click", (e) => { const b = e.target.closest("button[data-m]");
  if (b) voirMission(b.dataset.m, "#mis" + b.dataset.m).catch((err) => toast(err.message)); });

async function chargerAgents() {
  const l = await api("/agents");
  const groupes = {};
  l.forEach((a) => { (groupes[a.direction] = groupes[a.direction] || []).push(a); });
  $("#listeAg").innerHTML = Object.entries(groupes).map(([dir, ags]) => `
    <div class="carte"><h2 style="margin-top:0">${esc(dir)}</h2><div class="grille">
      ${ags.map((a) => `<div class="agent"><b>${esc(a.id)}</b> <span class="puce ${a.statut}">${lib(a.statut)}</span>
        <div class="meta">${esc(a.role)}${a.service ? " · " + esc(a.service) : ""}</div></div>`).join("")}
    </div></div>`).join("");
  const sel = $("#service");
  if (sel.options.length === 1) {
    [...new Set(l.filter((a) => a.service).map((a) => a.service))].forEach((s) => sel.add(new Option(s, s)));
  }
}

async function chargerJournal() {
  const l = await api("/ledger?limit=60");
  $("#listeLed").innerHTML = l.map((e) => `
    <div class="carte"><div class="ligne"><strong>${esc(e.acteur)}</strong><span class="puce">${esc(e.action)}</span>
      ${e.mission_id ? `<span class="meta">mission #${e.mission_id}</span>` : ""}</div>
      <div class="meta">${date(e.horodatage)}</div><div class="mono meta">${esc(e.hash.slice(0, 16))}…</div></div>`).join("");
}
$("#btnVerif").addEventListener("click", async () => {
  try { const v = await api("/ledger/verifier");
    $("#verif").textContent = v.valide ? `Chaîne intègre (${v.entrees} entrées).` : `ALTÉRATION détectée à l'entrée ${v.premiere_erreur}.`;
  } catch (err) { toast(err.message); }
});

$("#formMission").addEventListener("submit", async (e) => {
  e.preventDefault();
  const corps = { titre: $("#titre").value, consigne: $("#consigne").value, service: $("#service").value || null,
    montant_eur: $("#montant").value ? Number($("#montant").value) : null, action: $("#action").value || null };
  try { const r = await api("/missions", { method: "POST", body: JSON.stringify(corps) });
    toast("Mission #" + r.id + " lancée."); e.target.reset(); document.querySelector('[data-o="missions"]').click();
  } catch (err) { toast(err.message); }
});

// Arrêt d'urgence avec confirmation intégrée à la page
let arretActif = false;
$("#btnUrgence").addEventListener("click", () => {
  $("#texteUrgence").textContent = arretActif ? "Relancer la grille ? Les nouveaux traitements reprendront."
    : "Confirmer l'arrêt de toute la grille ? Les missions en cours seront suspendues.";
  $("#confirmUrgence").classList.add("vis");
});
$("#btnUrgenceNon").addEventListener("click", () => $("#confirmUrgence").classList.remove("vis"));
$("#btnUrgenceOui").addEventListener("click", async () => {
  try { await api("/killswitch", { method: "POST", body: JSON.stringify({ portee: "grille", actif: !arretActif }) });
    $("#confirmUrgence").classList.remove("vis"); toast(arretActif ? "Grille relancée." : "Arrêt d'urgence activé."); rafraichir();
  } catch (err) { toast(err.message); }
});

async function chargerEtat() {
  const s = await api("/sante"); const b = await api("/budget");
  arretActif = s.arret_urgence;
  $("#btnUrgence").textContent = arretActif ? "Relancer la grille" : "Arrêt d'urgence";
  $("#etat").textContent = (arretActif ? "ARRÊT D'URGENCE ACTIF · " : "") + `${s.agents} agents · ${b.fournisseur} · ${b.modele} · ${b.tokens} tokens ce mois`;
}

async function rafraichir() {
  const o = document.querySelector("#onglets .sel").dataset.o;
  try {
    await chargerEtat();
    if (o === "decisions") await chargerDecisions(); else chargerDecisions().catch(() => {});
    if (o === "missions") await chargerMissions();
    if (o === "agents" || $("#service").options.length === 1) await chargerAgents();
    if (o === "journal") await chargerJournal();
  } catch (err) { $("#etat").textContent = "Connexion impossible : " + err.message; }
}

try { const o = localStorage.getItem("onglet"); const b = o && document.querySelector(`[data-o="${o}"]`); if (b) b.click(); else rafraichir(); }
catch (e) { rafraichir(); }
setInterval(rafraichir, 15000);
</script>
</body>
</html>
