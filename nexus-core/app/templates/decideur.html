<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
<title>Décideur NEXUS</title>
<style>
  /* Fort contraste (lisible en plein soleil) ; thème sombre si le téléphone le demande. */
  :root {
    --fond: #ffffff; --carte: #ffffff; --texte: #0a0a0a; --doux: #3d4651; --bord: #8a94a1;
    --accent: #0b4fd6; --ok: #0b6b33; --ko: #a8130b; --att: #8a4b00; --zone: #eef1f5;
    --ok-fond: #e3f4ea; --ko-fond: #fbe7e5; --att-fond: #fff1db;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #0b0f14; --carte: #121922; --texte: #f4f7fa; --doux: #b6c0cc; --bord: #4a5666;
            --accent: #7aa7ff; --ok: #5fd68f; --ko: #ff7d72; --att: #ffb84d; --zone: #1a2330;
            --ok-fond: #12301f; --ko-fond: #3a1714; --att-fond: #3a2a10; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--fond); color: var(--texte);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 16px 10px; border-bottom: 2px solid var(--bord); background: var(--carte);
           position: sticky; top: 0; z-index: 3; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  .meta { color: var(--doux); font-size: 15px; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px 48px; }
  h2 { font-size: 19px; margin: 22px 0 10px; }
  .carte { background: var(--carte); border: 2px solid var(--bord); border-radius: 14px; padding: 14px;
           margin-bottom: 14px; }
  .carte.urgent { border-color: var(--ko); }
  .tete { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .tete strong { font-size: 18px; }
  .puce { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 700;
          border: 2px solid currentColor; }
  .eleve { color: var(--ko); } .moyen { color: var(--att); } .faible { color: var(--ok); }
  dl { margin: 10px 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
  dt { font-weight: 700; } dd { margin: 0; }
  .infos { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 15px; color: var(--doux); margin: 8px 0; }
  .raisons { font-size: 15px; color: var(--doux); margin: 6px 0; }
  button { font: inherit; font-weight: 700; width: 100%; min-height: 56px; border-radius: 12px; cursor: pointer;
           border: 2px solid var(--bord); background: var(--zone); color: var(--texte); margin-top: 8px; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .b-ok { background: var(--ok-fond); border-color: var(--ok); color: var(--ok); }
  .b-ko { background: var(--ko-fond); border-color: var(--ko); color: var(--ko); }
  .b-rev { background: var(--att-fond); border-color: var(--att); color: var(--att); }
  .b-conf { background: var(--accent); border-color: var(--accent); color: #fff; }
  .actions { display: grid; grid-template-columns: 1fr; gap: 0; }
  input { font: inherit; width: 100%; min-height: 52px; padding: 10px 12px; border-radius: 10px;
          border: 2px solid var(--bord); background: var(--fond); color: var(--texte); margin-top: 8px; }
  label { display: block; margin-top: 10px; font-weight: 700; }
  .confirmer { border-top: 2px dashed var(--bord); margin-top: 10px; padding-top: 6px; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--zone); padding: 10px; border-radius: 10px;
        font-size: 15px; max-height: 50vh; overflow: auto; }
  .lien { background: none; border: none; color: var(--accent); text-decoration: underline; min-height: 44px;
          width: auto; padding: 0; margin: 0; font-weight: 700; }
  .vide { color: var(--doux); font-style: italic; }
  .alerte { border: 2px solid var(--ko); background: var(--ko-fond); color: var(--ko); border-radius: 12px;
            padding: 10px 12px; margin: 10px 0; font-weight: 700; }
  .hist { border-bottom: 1px solid var(--bord); padding: 8px 0; font-size: 15px; }
  #message { position: fixed; left: 12px; right: 12px; bottom: 12px; padding: 14px; border-radius: 12px;
             background: var(--texte); color: var(--fond); font-weight: 700; display: none; z-index: 5; }
</style>
</head>
<body>
<header>
  <h1>Décideur NEXUS</h1>
  <div class="meta" id="resumeJour">Chargement…</div>
</header>
<main>
  <div id="alertes"></div>
  <h2>Décisions à prendre</h2>
  <div id="cartes"><p class="vide">Chargement…</p></div>
  <h2>20 dernières décisions</h2>
  <div id="historique"></div>
  <p class="meta"><a href="/cockpit" style="color:var(--accent)">Cockpit complet</a></p>
</main>
<div id="message" role="status" aria-live="polite"></div>
<script>
"use strict";
const API = "/cockpit/api";
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LIB = { faible: "faible", moyen: "moyen", eleve: "élevé", validee: "validée", refusee: "refusée",
  revision: "révision", expiree: "expirée" };
let ETAT = null;

function message(t) { const m = $("#message"); m.textContent = t; m.style.display = "block";
  clearTimeout(message.h); message.h = setTimeout(() => m.style.display = "none", 4000); }

async function api(chemin, corps) {
  // X-Cockpit + JSON : exigés par le serveur pour toute écriture (anti-CSRF).
  const options = { headers: { "Content-Type": "application/json", "X-Cockpit": "1" }, credentials: "same-origin" };
  if (corps !== undefined) { options.method = "POST"; options.body = JSON.stringify(corps); }
  const r = await fetch(API + chemin, options);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Erreur " + r.status);
  return d;
}

function duree(s) {
  if (s <= 0) return "expirée";
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h} h ${String(m).padStart(2, "0")}` : `${m} min`;
}
const heure = (iso) => new Date(iso).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Paris" });

function rendreCarte(c) {
  const cout = c.cout_estime_eur > 0 || c.tokens ? `<span>Coût : ${Number(c.cout_estime_eur).toFixed(2)} €${c.tokens ? " · " + c.tokens.toLocaleString("fr-FR") + " tokens" : ""}</span>` : "";
  return `<article class="carte ${c.urgent ? "urgent" : ""}" id="carte${c.id}" data-id="${c.id}">
    <div class="tete"><strong>#${c.id} · ${esc(c.titre)}</strong>
      <span class="puce ${c.risque}">Risque ${LIB[c.risque] || esc(c.risque)}</span></div>
    <dl>
      <dt>Quoi</dt><dd>${esc(c.resume.quoi)}</dd>
      <dt>Pourquoi</dt><dd>${esc(c.resume.pourquoi)}</dd>
      <dt>Si refus</dt><dd>${esc(c.resume.si_refus)}</dd>
    </dl>
    <div class="raisons">Risque : ${c.raisons.map(esc).join(" · ")}</div>
    <div class="infos">
      <span>${esc(c.service || "service ?")}</span><span>Projet ${esc(c.projet)}</span>
      <span>Niveau ${esc(c.fonctionnement)}</span>${cout}
      <span class="${c.urgent ? "eleve" : ""}"><b>Refus automatique dans ${duree(c.restant_s)}</b></span>
    </div>
    ${c.objet === "lancement_f4" ? "" : `<button class="lien" type="button" data-livrable="${c.mission_id}">Voir le livrable</button><div id="liv${c.id}"></div>`}
    <div class="actions" id="act${c.id}">
      <button class="b-ok" type="button" data-choix="valider">Valider</button>
      <button class="b-ko" type="button" data-choix="refuser">Refuser</button>
      ${c.objet === "lancement_f4" ? "" : `<button class="b-rev" type="button" data-choix="reviser">Demander une révision</button>`}
    </div>
    <div class="confirmer" id="conf${c.id}" hidden></div>
  </article>`;
}

function rendre() {
  const e = ETAT, j = e.compteur_jour;
  $("#resumeJour").textContent = `${e.cartes.length} en attente · ${j.decidees} décidée(s) aujourd'hui · ` +
    `${j.creees}/${j.plafond} N3 créées (plafond du jour) · prochaine session ${heure(e.prochaine_session)}`;
  const alertes = [];
  if (j.creees >= j.plafond) alertes.push("Plafond de " + j.plafond + " décisions N3 atteint aujourd'hui : les suivantes sont mises en file.");
  if (e.verrou_restant_s > 0) alertes.push("Code Décideur verrouillé encore " + Math.ceil(e.verrou_restant_s / 60) + " min (trop d'erreurs).");
  if (!e.code_configure) alertes.push("Code Décideur non configuré : les décisions à risque élevé ne peuvent pas être validées.");
  $("#alertes").innerHTML = alertes.map((a) => `<div class="alerte">${esc(a)}</div>`).join("");
  $("#cartes").innerHTML = e.cartes.length ? e.cartes.map(rendreCarte).join("") : '<p class="vide">Aucune décision en attente.</p>';
  $("#historique").innerHTML = e.historique.length ? e.historique.map((h) => `<div class="hist">
      <b>#${h.id}</b> ${esc(h.titre)} — <span class="${h.statut === "validee" ? "faible" : h.statut === "refusee" || h.statut === "expiree" ? "eleve" : "moyen"}">${esc(LIB[h.statut] || h.statut)}</span>
      <div class="meta">${h.decide_le ? new Date(h.decide_le + "Z").toLocaleString("fr-FR", { timeZone: "Europe/Paris" }) : ""} · projet ${esc(h.projet)}${h.commentaire ? " · « " + esc(h.commentaire) + " »" : ""}</div></div>`).join("")
    : '<p class="vide">Aucune décision pour le moment.</p>';
}

async function charger() {
  try { ETAT = await api("/decideur/etat"); rendre(); }
  catch (err) { $("#resumeJour").textContent = "Connexion impossible : " + err.message; }
}

// Étape 1 : préparer (jeton à usage unique) ; étape 2 : « Confirmer : valider #12 ».
async function preparer(id, choix) {
  const zone = $("#conf" + id);
  let motif = null;
  if (choix === "reviser") {
    zone.hidden = false;
    zone.innerHTML = `<label for="motif${id}">Motif de la révision (court)</label>
      <input id="motif${id}" maxlength="200" autocomplete="off">
      <button class="b-conf" type="button" data-etape="motif">Continuer</button>
      <button type="button" data-etape="annuler">Annuler</button>`;
    zone.dataset.choix = choix;
    $("#motif" + id).focus();
    return;
  }
  await demanderConfirmation(id, choix, motif);
}

async function demanderConfirmation(id, choix, motif) {
  const zone = $("#conf" + id);
  try {
    const p = await api(`/decideur/decisions/${id}/preparer`, { choix, commentaire: motif });
    zone.hidden = false;
    zone.dataset.choix = choix; zone.dataset.jeton = p.jeton; zone.dataset.motif = motif || "";
    zone.innerHTML = (p.code_requis ? `<label for="code${id}">Code Décideur (6 chiffres) — risque élevé</label>
        <input id="code${id}" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code">` : "") +
      `<button class="b-conf" type="button" data-etape="confirmer">${esc(p.libelle)}</button>
       <button type="button" data-etape="annuler">Annuler</button>`;
    $("#act" + id).hidden = true;
    (p.code_requis ? $("#code" + id) : zone.querySelector("[data-etape=confirmer]")).focus();
  } catch (err) { message(err.message); }
}

async function confirmer(id) {
  const zone = $("#conf" + id), code = $("#code" + id);
  try {
    const r = await api(`/decideur/decisions/${id}/confirmer`, { choix: zone.dataset.choix, jeton: zone.dataset.jeton,
      commentaire: zone.dataset.motif || null, code: code ? code.value : null });
    message(`Décision #${id} : ${LIB[r.statut] || r.statut}.`);
    await charger();
  } catch (err) { message(err.message); if (code) { code.value = ""; code.focus(); } }
}

function annuler(id) { const z = $("#conf" + id); z.hidden = true; z.innerHTML = ""; $("#act" + id).hidden = false; }

$("#cartes").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const carte = b.closest("[data-id]"); const id = carte && carte.dataset.id;
  if (b.dataset.livrable) {
    const zone = $("#liv" + id);
    if (zone.innerHTML) { zone.innerHTML = ""; return; }
    try { const m = await api("/missions/" + b.dataset.livrable);
      zone.innerHTML = `<pre>${esc(m.livrable_texte || "(pas de livrable)")}</pre>`; } catch (err) { message(err.message); }
    return;
  }
  if (b.dataset.choix) return preparer(id, b.dataset.choix);
  if (b.dataset.etape === "annuler") return annuler(id);
  if (b.dataset.etape === "motif") {
    const motif = ($("#motif" + id).value || "").trim();
    if (motif.length < 3) return message("Indiquez un motif (3 caractères au moins).");
    return demanderConfirmation(id, "reviser", motif);
  }
  if (b.dataset.etape === "confirmer") return confirmer(id);
});

charger();
setInterval(() => { if (!document.querySelector(".confirmer:not([hidden])")) charger(); }, 30000);
</script>
</body>
</html>
