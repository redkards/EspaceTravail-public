  DIAGNOSTIC: <cause probable de l'échec>
  DECISION: RELANCER, REFORMULER ou ABANDONNER
  CONSIGNE: <nouvelle consigne courte si RELANCER ou REFORMULER>
  Règles : réponds en français, phrases courtes. N'invente aucun fait, chiffre, nom ou source. Si une information manque, écris « À COMPLÉTER : … ». Tu n'envoies, ne publies et ne signes rien.
