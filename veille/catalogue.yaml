# CATALOGUE DE VEILLE SYFER — sources vérifiées (base « virtuelle » : on stocke des fiches courtes, jamais les articles)
# Généré puis relu le 2026-11-04. Modifiable à la main (voir veille/README.md, « Ajouter une source »).
# verifie      : date à laquelle le site/la page officielle a été vu(e) en ligne (recherche/lecture web), sinon non_verifie
# flux_verifie : oui (URL exacte du flux confirmée) | motif (URL construite selon un motif documenté)
#                | non (URL connue mais à confirmer par `python veille/collecteur.py verifier` sur le VPS) | sans_objet (manuel)
# collecte     : oui | non (avec `raison`) — les plateformes fermées sont listées pour mémoire, jamais collectées.
# confiance    : A officielle · B expert reconnu / presse spécialisée · C communauté · D réseau social
# licence      : licence du contenu ; stockage : integral (licence ouverte) | extrait | metadonnees | agrege (social)
# type_doc     : actualite, norme, guide, loi, jurisprudence, documentation, cahier_des_charges, appel_offres,
#                donnees, recherche, release, discussion, social, podcast
# acces document : texte découpé en sections par documents/ingestion.py (liste : documents/documents.yaml)
# Clés d'API : jamais ici. Seulement le NOM de la variable d'environnement (cle_env).
