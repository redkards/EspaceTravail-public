# Briques des mini-scénarios (méthode des 100 itérations).
#
# Chaque DIMENSION a une variante NEUTRE (celle qu'utilise la réduction pour « enlever » la brique)
# et des variantes réalistes, chacune avec un poids de tirage (défaut 1). Les métadonnées
# (sensible, nie, valeur, type…) sont la VÉRITÉ ATTENDUE utilisée par les oracles : elles ne
# viennent pas du code de nexus-core.
#
# Gabarits : {sujet}, {coeur}, {marqueur} ; verbes : {montant} (texte du montant ou rien).

version: 1
seuil_risque_eleve_eur: 1000
code_decideur: "246810"

dimensions:

